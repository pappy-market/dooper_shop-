<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BDU Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#151719;--muted:#737982;--accent:#087f5b;--line:#e2e5e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:75px}
header{padding:16px;position:sticky;top:0;background:var(--bg);z-index:5}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:25px}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.icon{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.search{display:flex;gap:8px;margin-top:12px}.search input,.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 16px}.chip{white-space:nowrap;padding:9px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.chip.active{background:var(--accent);color:#fff}
.hero{margin:10px 16px;padding:22px;border-radius:22px;background:linear-gradient(135deg,#075b43,#16a679);color:#fff}.hero h2{margin:0 0 5px}.hero p{margin:0}
section{padding:8px 16px}.head{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.pic{height:155px;background:#e9ecef;display:grid;place-items:center;font-size:45px}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:11px}.name{font-weight:700}.price{font-weight:800;color:var(--accent);margin-top:4px}.meta,.small{font-size:12px;color:var(--muted);margin-top:4px}.add,.primary{width:100%;padding:11px;border-radius:11px;background:var(--accent);color:white;margin-top:9px}.secondary{width:100%;padding:11px;border-radius:11px;background:var(--card);border:1px solid var(--line);margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10}.bottom nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav{padding:8px;background:none;color:var(--muted);font-size:11px}.nav b{display:block;font-size:18px}.nav.active{color:var(--accent)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;max-height:94vh;overflow:auto;margin:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:17px}.close{float:right;padding:8px 11px;border-radius:11px;background:var(--card);border:1px solid var(--line)}.big{width:100%;height:260px;object-fit:cover;border-radius:18px}.form{display:grid;gap:9px}.item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0}.row{display:flex;gap:7px}.empty{text-align:center;padding:35px;color:var(--muted)}#adminPanel{display:none}.toast{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:12px;z-index:50}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div><h1>🛍️ BDU Market</h1><span class="small">Bahir Dar University Marketplace</span></div><button class="icon" onclick="openAdmin()">🔐</button></div>
<div class="search"><input id="search" placeholder="Search products" oninput="render()"><button class="icon" onclick="toggleTheme()">◐</button></div></header>
<div class="chips" id="cats"></div>
<div class="hero"><h2>Student marketplace 🎓</h2><p>Educational materials, beauty products, electronics and more.</p></div>
<section><div class="head"><h3>Products</h3><span id="count" class="small"></span></div><div id="products" class="grid"></div></section>

<section id="adminPanel">
<button class="close" onclick="closeAdmin()">✕</button><h2>🔐 Admin</h2>
<div id="loginBox" class="item"><p>Enter your admin password.</p><div class="form"><input id="adminPassword" type="password" placeholder="Password"><button class="primary" onclick="loginAdmin()">Enter</button></div></div>
<div id="adminArea" style="display:none">
<div class="row"><button class="primary" onclick="newProduct()">➕ Product</button><button class="primary" onclick="newCategory()">➕ Category</button></div>
<div id="productEditor" class="item" style="display:none"><h3 id="editorTitle">Add product</h3><div class="form">
<input id="pid" type="hidden"><input id="nameEn" placeholder="Name English"><input id="nameAm" placeholder="ስም በአማርኛ">
<textarea id="descEn" placeholder="Description English"></textarea><textarea id="descAm" placeholder="መግለጫ በአማርኛ"></textarea>
<input id="price" type="number" placeholder="Price ETB"><input id="stock" type="number" placeholder="Stock"><select id="category"></select>
<label><input id="featured" type="checkbox"> Featured</label><input id="image" type="file" accept="image/*"><img id="preview" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;display:none">
<button class="primary" onclick="saveProduct()">Save</button><button class="secondary" onclick="cancelEditor()">Cancel</button>
</div></div>
<h3>Products</h3><div id="adminProducts"></div><h3>Categories</h3><div id="adminCategories"></div></div>
</section>
</div>
<div class="bottom"><nav>
<button class="nav active" onclick="home()"><b>⌂</b>Home</button><button class="nav" onclick="document.getElementById('cats').scrollIntoView()"><b>☷</b>Categories</button><button class="nav" onclick="cartView()"><b>🛒</b>Cart <span id="cartCount"></span></button><button class="nav" onclick="ordersView()"><b>📦</b>Orders</button><button class="nav" onclick="profileView()"><b>👤</b>Profile</button>
</nav></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyA0y_Sd6xLDZjBJTSyfDrtd4XgnPSdKoc",
 authDomain:"dooper-shop-fce54.firebaseapp.com",
 projectId:"dooper-shop-fce54",
 storageBucket:"dooper-shop-fce54.firebasestorage.app",
 messagingSenderId:"38979650471",
 appId:"1:38979650471:web:04992462cbcf8666ba6c82"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),storage=firebase.storage();
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const ADMIN_PASSWORD="281888$";
let products=[],categories=[],filter="all",cart=JSON.parse(localStorage.bduCart||"[]"),lang=localStorage.bduLang||"en",editing=null;

const defaults=[
{id:"edu",nameEn:"Educational Materials",nameAm:"የትምህርት ዕቃዎች"},
{id:"beauty",nameEn:"Cosmetics & Beauty",nameAm:"ውበት እና ኮስሜቲክስ"},
{id:"electronics",nameEn:"Electronics",nameAm:"ኤሌክትሮኒክስ"},
{id:"stationery",nameEn:"Stationery",nameAm:"የጽሕፈት ዕቃዎች"},
{id:"other",nameEn:"Other",nameAm:"ሌሎች"}];

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const tr=(e,a)=>lang==="am"?(a||e):(e||a),money=n=>new Intl.NumberFormat().format(Number(n)||0)+" ETB";
function msg(x){let e=document.getElementById("toast");e.textContent=x;e.style.display="block";setTimeout(()=>e.style.display="none",2000)}
function saveCart(){localStorage.bduCart=JSON.stringify(cart);document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0)||""}
function renderCats(){document.getElementById("cats").innerHTML='<button class="chip '+(filter==="all"?"active":"")+'" onclick="setFilter('all')">All</button>'+categories.map(c=>`<button class="chip ${filter===c.id?"active":""}" onclick="setFilter('${c.id}')">${esc(tr(c.nameEn,c.nameAm))}</button>`).join("")}
function setFilter(x){filter=x;render()}
function render(){renderCats();let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>p.active!==false&& (filter==="all"||p.category===filter) && ((p.nameEn||"")+" "+(p.nameAm||"")+" "+(p.descriptionEn||"")).toLowerCase().includes(q));document.getElementById("count").textContent=list.length+" items";document.getElementById("products").innerHTML=list.length?list.map(p=>`<article class="card" onclick="details('${p.id}')"><div class="pic">${p.imageUrl?`<img loading="lazy" src="${esc(p.imageUrl)}">`:"📦"}</div><div class="info"><div class="name">${esc(tr(p.nameEn,p.nameAm))}</div><div class="price">${money(p.price)}</div><div class="meta">⭐ ${Number(p.rating||0).toFixed(1)} · ${p.reviewCount||0} reviews · ${p.stock>0?"In stock":"Out of stock"}</div><button class="add" onclick="event.stopPropagation();add('${p.id}')">${p.stock>0?"Add to cart":"Out of stock"}</button></div></article>`).join(""):'<div class="empty">No products found.</div>'}
function details(id){let p=products.find(x=>x.id===id);if(!p)return;show(`<button class="close" onclick="closeModal()">✕</button>${p.imageUrl?`<img class="big" src="${esc(p.imageUrl)}">`:"<div class=big style='display:grid;place-items:center;font-size:70px'>📦</div>"}<h2>${esc(tr(p.nameEn,p.nameAm))}</h2><div class=price>${money(p.price)}</div><p>${esc(tr(p.descriptionEn,p.descriptionAm))}</p><div class=meta>⭐ ${Number(p.rating||0).toFixed(1)} · ${p.reviewCount||0} reviews</div><button class=primary onclick="add('${p.id}');closeModal()">🛒 Add to cart</button><button class=secondary onclick="checkout('${p.id}')">Buy now</button><hr><h3>Reviews / ግምገማ</h3><div class=item>Rating and comments are saved in Firebase.</div>`)}
function add(id){let p=products.find(x=>x.id===id);if(!p||p.stock<1)return msg("Out of stock");let x=cart.find(a=>a.id===id);if(x)x.qty=Math.min(p.stock,x.qty+1);else cart.push({id,qty:1});saveCart();msg("Added to cart")}
function show(x){document.getElementById("modal").classList.add("show");document.getElementById("sheet").innerHTML=x}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function cartView(){let total=0;let rows=cart.map(x=>{let p=products.find(a=>a.id===x.id);if(!p)return"";total+=p.price*x.qty;return`<div class=item><b>${esc(tr(p.nameEn,p.nameAm))}</b><br>${money(p.price)} × ${x.qty}<div class=row><button class=secondary onclick="changeCart('${p.id}',-1)">−</button><button class=secondary onclick="changeCart('${p.id}',1)">+</button><button class=secondary onclick="removeCart('${p.id}')">Remove</button></div></div>`}).join("");show(`<button class=close onclick=closeModal()>✕</button><h2>🛒 Cart</h2>${rows||'<div class=empty>Cart is empty.</div>'}<h3>Total: ${money(total)}</h3>${rows?'<button class=primary onclick=checkout()">Checkout</button>':""}`)}
function changeCart(id,n){let x=cart.find(a=>a.id===id),p=products.find(a=>a.id===id);if(!x)return;x.qty+=n;if(x.qty<1)cart=cart.filter(a=>a.id!==id);if(p)x.qty=Math.min(x.qty,p.stock);saveCart();cartView()}
function removeCart(id){cart=cart.filter(a=>a.id!==id);saveCart();cartView()}
function checkout(single){let list=single?[{id:single,qty:1}]:cart;if(!list.length)return msg("Cart is empty");let u=tg?.initDataUnsafe?.user||{};let total=list.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);show(`<button class=close onclick=closeModal()>✕</button><h2>📋 Checkout</h2><p>Total: <b>${money(total)}</b></p><div class=form><input id=oName placeholder="Full name" value="${esc(u.first_name||"")}"><input id=oId placeholder="University ID"><input id=oTg placeholder="Telegram username" value="${esc(u.username?"@"+u.username:"@")}"><input id=oDorm placeholder="Dorm / Block"><input id=oRoom placeholder="Room number"><input id=oPhone placeholder="Phone number"><textarea id=oNotes placeholder="Order notes"></textarea><button class=primary onclick='placeOrder(${JSON.stringify(list)})'>Place order</button></div>`)}
async function placeOrder(list){try{let u=tg?.initDataUnsafe?.user||{};let items=list.map(x=>{let p=products.find(a=>a.id===x.id);return{id:p.id,name:tr(p.nameEn,p.nameAm),price:p.price,qty:x.qty}});let total=items.reduce((s,x)=>s+x.price*x.qty,0);let r=await db.collection("orders").add({buyerName:document.getElementById("oName").value,buyerUniversityId:document.getElementById("oId").value,buyerTelegram:document.getElementById("oTg").value,buyerDorm:document.getElementById("oDorm").value,buyerRoom:document.getElementById("oRoom").value,buyerPhone:document.getElementById("oPhone").value,notes:document.getElementById("oNotes").value,telegramId:u.id||null,items,total,status:"Pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});cart=[];saveCart();show(`<div class=empty>✅<h2>Order placed!</h2><p>Order: <b>${r.id.slice(0,8).toUpperCase()}</b></p><p>Contact seller to arrange payment and collection.</p><button class=primary onclick="window.open('https://t.me/sky_dooper','_blank')">Contact @sky_dooper</button><button class=secondary onclick=closeModal()>Done</button></div>`)}catch(e){msg(e.message)}}
function ordersView(){show('<button class=close onclick=closeModal()>✕</button><h2>📦 Orders</h2><div class=empty>Your orders are stored in Firebase. Telegram ID can be used to show private order history.</div>')}
function profileView(){let u=tg?.initDataUnsafe?.user||{};show(`<button class=close onclick=closeModal()>✕</button><h2>👤 Profile</h2><div class=item>${esc(u.first_name||"Student")}<br>@${esc(u.username||"not available")}</div><button class=secondary onclick="lang=lang==='en'?'am':'en';localStorage.bduLang=lang;render();profileView()">🌐 ${lang==='en'?'አማርኛ':'English'}</button><button class=secondary onclick=toggleTheme()>◐ Theme: ${localStorage.bduTheme||'system'}</button>`)}
function home(){scrollTo({top:0,behavior:"smooth"})}
function openAdmin(){document.getElementById("adminPanel").style.display="block";document.getElementById("adminPanel").scrollIntoView({behavior:"smooth"})}
function closeAdmin(){document.getElementById("adminPanel").style.display="none"}
function loginAdmin(){if(document.getElementById("adminPassword").value===ADMIN_PASSWORD){document.getElementById("loginBox").style.display="none";document.getElementById("adminArea").style.display="block";renderAdmin()}else msg("Wrong password")}
function newProduct(){editing=null;document.getElementById("productEditor").style.display="block";document.getElementById("editorTitle").textContent="Add product";["pid","nameEn","nameAm","descEn","descAm","price","stock"].forEach(x=>document.getElementById(x).value="");document.getElementById("featured").checked=false;document.getElementById("preview").style.display="none"}
function editProduct(id){let p=products.find(x=>x.id===id);editing=p;newProduct();document.getElementById("pid").value=p.id;document.getElementById("nameEn").value=p.nameEn||"";document.getElementById("nameAm").value=p.nameAm||"";document.getElementById("descEn").value=p.descriptionEn||"";document.getElementById("descAm").value=p.descriptionAm||"";document.getElementById("price").value=p.price||"";document.getElementById("stock").value=p.stock??"";document.getElementById("category").value=p.category||"";document.getElementById("featured").checked=!!p.featured;if(p.imageUrl){document.getElementById("preview").src=p.imageUrl;document.getElementById("preview").style.display="block"}}
function cancelEditor(){document.getElementById("productEditor").style.display="none"}
document.getElementById("image").addEventListener("change",e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display="block"};r.readAsDataURL(f)}})
async function saveProduct(){try{let file=document.getElementById("image").files[0],url=editing?.imageUrl||"";if(file){let ref=storage.ref("products/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_"));await ref.put(file);url=await ref.getDownloadURL()}let data={nameEn:nameEn.value.trim(),nameAm:nameAm.value.trim(),descriptionEn:descEn.value.trim(),descriptionAm:descAm.value.trim(),price:Number(price.value),stock:Number(stock.value),category:category.value,featured:featured.checked,imageUrl:url,active:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(editing)await db.collection("products").doc(editing.id).update(data);else await db.collection("products").add({...data,rating:0,reviewCount:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg("Saved");cancelEditor();loadData()}catch(e){msg("Save failed: "+e.message)}}
async function delProduct(id){if(confirm("Delete product?")){await db.collection("products").doc(id).delete();loadData()}}
function newCategory(){let n=prompt("Category name");if(!n)return;let id=n.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now();db.collection("categories").doc(id).set({nameEn:n,nameAm:n,active:true}).then(loadData)}
async function delCategory(id){if(confirm("Delete category?")){await db.collection("categories").doc(id).delete();loadData()}}
function renderAdmin(){category.innerHTML=categories.map(c=>`<option value="${c.id}">${esc(c.nameEn)}</option>`).join("");adminProducts.innerHTML=products.map(p=>`<div class=item><b>${esc(p.nameEn)}</b><div class=small>${money(p.price)} · stock ${p.stock}</div><div class=row><button class=secondary onclick="editProduct('${p.id}')">Edit</button><button class=secondary onclick="delProduct('${p.id}')">Delete</button></div></div>`).join("")||"<p class=small>No products";adminCategories.innerHTML=categories.map(c=>`<div class=item>${esc(c.nameEn)} / ${esc(c.nameAm)}<button class=secondary onclick="delCategory('${c.id}')">Delete</button></div>`).join("")}
async function loadData(){try{let cs=await db.collection("categories").get();categories=cs.docs.map(d=>({id:d.id,...d.data()}));if(!categories.length)categories=defaults;let ps=await db.collection("products").get();products=ps.docs.map(d=>({id:d.id,...d.data()}));render();if(document.getElementById("adminArea").style.display==="block")renderAdmin()}catch(e){categories=defaults;products=[];render();console.warn(e)}}
function toggleTheme(){let x=localStorage.bduTheme||"system";localStorage.bduTheme=x==="system"?"dark":x==="dark"?"light":"system";applyTheme();msg("Theme: "+localStorage.bduTheme)}
function applyTheme(){let x=localStorage.bduTheme||"system",dark=x==="dark"||(x==="system"&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.style.setProperty("--bg",dark?"#101214":"#f4f5f7");document.documentElement.style.setProperty("--card",dark?"#191c20":"#fff");document.documentElement.style.setProperty("--text",dark?"#f5f5f5":"#151719");document.documentElement.style.setProperty("--muted",dark?"#a7adb5":"#737982");document.documentElement.style.setProperty("--line",dark?"#2b3036":"#e2e5e8")}
applyTheme();saveCart();loadData();
</script>
</body>
</html>
