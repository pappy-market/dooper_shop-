<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="BDU Market — Bahir Dar University student marketplace">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --primary:#0f766e;--primary2:#115e59;--accent:#f59e0b;
  --bg:#f4f7f7;--card:#fff;--text:#102a2a;--muted:#708080;
  --line:#e1e8e7;--danger:#dc2626;--success:#15803d;
  --shadow:0 10px 30px rgba(15,118,110,.09);--r:18px
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,247,247,.94);
backdrop-filter:blur(16px);padding:12px 15px 10px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#0f766e,#19a995);
display:grid;place-items:center;color:#fff;font-weight:950;box-shadow:var(--shadow)}
.brand h1{font-size:18px;margin:0;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.topactions{display:flex;gap:7px}.iconbtn{width:40px;height:40px;border-radius:13px;background:#fff;
box-shadow:var(--shadow);font-size:18px;border:1px solid var(--line)}
.admin-icon{background:#fff6e6}
.search{margin-top:11px;position:relative}.search input{width:100%;height:46px;border:1px solid var(--line);
border-radius:15px;background:#fff;padding:0 45px 0 15px;outline:none}.search span{position:absolute;right:14px;top:12px;color:var(--muted)}
main{padding:16px 15px 100px}.hero{border-radius:24px;padding:22px;background:linear-gradient(135deg,#0f766e,#134e4a);
color:#fff;position:relative;overflow:hidden;margin-bottom:18px}.hero:after{content:"";position:absolute;width:190px;height:190px;
border-radius:50%;right:-70px;top:-75px;background:rgba(255,255,255,.1)}.hero h2{margin:0 0 8px;font-size:26px;line-height:1.08;max-width:78%}
.hero p{margin:0;opacity:.87;font-size:13px;max-width:78%;line-height:1.5}.heroaction{margin-top:16px;background:#fff;color:var(--primary);
padding:10px 14px;border-radius:12px;font-weight:850}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 11px}
.sectionhead h2{font-size:17px;margin:0}.sectionhead button{background:none;color:var(--primary);font-weight:800;font-size:12px}
.cats{display:flex;gap:9px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:14px;font-size:12px;font-weight:800}
.cat.active{background:#e5f4f2;border-color:#8fd1ca;color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.035)}
.productimg{aspect-ratio:1/1;background:#edf2f1;position:relative;overflow:hidden}.productimg img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;background:#fff;padding:5px 8px;border-radius:9px;font-size:10px;font-weight:900;box-shadow:var(--shadow)}
.stockout{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;font-weight:900;color:var(--danger)}
.productbody{padding:11px}.productname{font-weight:850;font-size:14px;line-height:1.25;min-height:35px}.price{font-weight:950;color:var(--primary);margin-top:7px}
.meta{color:var(--muted);font-size:11px;margin-top:5px}.rating{color:#e99a00;font-size:12px}.add{width:100%;margin-top:9px;background:#e7f5f3;color:var(--primary);
padding:9px;border-radius:11px;font-weight:850}.add:disabled{opacity:.45;cursor:not-allowed}
.bottomnav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:40;width:min(760px,100%);
display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.navbtn{background:none;color:var(--muted);font-size:10px;font-weight:800;padding:5px;border-radius:12px}.navbtn .ni{display:block;font-size:20px;margin-bottom:2px}
.navbtn.active{color:var(--primary);background:#eef8f6}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:100;background:#102a2a;color:#fff;
padding:11px 15px;border-radius:13px;font-size:12px;max-width:90%;box-shadow:0 12px 35px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(5,25,25,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:17px 15px calc(25px + env(safe-area-inset-bottom));
box-shadow:0 -20px 50px rgba(0,0,0,.2)}.sheettop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheettop h2{font-size:19px;margin:0}.close{width:38px;height:38px;border-radius:12px;background:#f2f5f5;font-size:24px;color:var(--muted)}
.form{display:grid;gap:12px}.field label{display:block;font-size:11px;font-weight:850;margin-bottom:5px;color:#4e6262}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;outline:none;background:#fff}
.field textarea{min-height:90px;resize:vertical}.primary{background:var(--primary);color:#fff;padding:12px 15px;border-radius:13px;font-weight:900}
.secondary{background:#edf2f1;color:var(--text);padding:12px 15px;border-radius:13px;font-weight:850}
.danger{background:#feecec;color:var(--danger);padding:10px 12px;border-radius:11px;font-weight:850}.notice{background:#f1f8f7;border:1px solid #d9eeeb;
padding:11px;border-radius:13px;color:#426060;font-size:12px;line-height:1.5}
.detailimg{width:100%;max-height:360px;object-fit:cover;border-radius:20px;background:#eef2f2}.detailprice{font-size:23px;font-weight:950;color:var(--primary);margin-top:12px}
.detaildesc{font-size:13px;line-height:1.6;color:#526565}.qtyrow{display:flex;align-items:center;gap:10px}.qtybtn{width:38px;height:38px;border-radius:11px;background:#edf2f1;font-weight:900}
.qtynum{min-width:30px;text-align:center;font-weight:900}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.totalbox{background:#f2f7f6;border-radius:15px;padding:13px;display:flex;justify-content:space-between;font-weight:900}
.pageTitle{font-size:23px;margin:3px 0 15px}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.empty .big{font-size:42px;margin-bottom:10px}
.list{display:grid;gap:10px}.ordercard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.orderhead{display:flex;justify-content:space-between;gap:10px}
.status{padding:5px 8px;border-radius:9px;background:#fff4d9;color:#9a6500;font-size:10px;font-weight:900}.status.confirmed,.status.ready,.status.delivered{background:#e7f6eb;color:var(--success)}
.status.cancelled{background:#feecec;color:var(--danger)}.orderitems{font-size:12px;color:#526565;margin:9px 0}.orderfoot{display:flex;justify-content:space-between;font-weight:900}
.adminbar{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.admintab{flex:0 0 auto;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-size:11px;font-weight:850}
.admintab.active{background:#e7f5f3;color:var(--primary);border-color:#9bd6cf}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}
.adminitem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px}
.adminthumb{width:55px;height:55px;border-radius:11px;object-fit:cover;background:#edf2f1}.admininfo{flex:1;min-width:0}.admininfo b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px;flex-wrap:wrap}.smallbtn{padding:7px 9px;border-radius:9px;background:#edf2f1;font-size:10px;font-weight:850}.smallbtn.red{background:#feecec;color:var(--danger)}
.catadmin{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}
.preview{width:100%;max-height:180px;object-fit:cover;border-radius:13px;background:#eef2f2;display:none}
.spinner{width:25px;height:25px;border:3px solid #d8e5e3;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:25px auto}
@keyframes spin{to{transform:rotate(360deg)}}.skeleton{height:260px;border-radius:18px;background:linear-gradient(90deg,#edf2f1,#f8faf9,#edf2f1);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(4,1fr)}}
.am{font-family:"Noto Sans Ethiopic",system-ui,sans-serif}
</style>
</head>

<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getFirestore,collection,doc,getDoc,addDoc,setDoc,updateDoc,deleteDoc,
  onSnapshot,serverTimestamp,query,orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import {
  getAuth,signInAnonymously,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
  getStorage,ref,uploadBytes,getDownloadURL,deleteObject
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";

/* =========================================================
   FIREBASE CONFIG FROM YOUR BDU MARKET PROJECT
   ========================================================= */
const firebaseConfig={
  apiKey:"AIzaSyA0y_Sd6xLDZjBJTsyfRtd4XgnPSdKoc",
  authDomain:"dooper-shop-fce54.firebaseapp.com",
  projectId:"dooper-shop-fce54",
  storageBucket:"dooper-shop-fce54.firebasestorage.app",
  messagingSenderId:"38979650471",
  appId:"1:38979650471:web:04992462cbcf8666ba6c82",
  measurementId:"G-KTQZCDP1HT"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const storage=getStorage(app);

/* OWNER PASSWORD REQUESTED FOR THE ADMIN UI.
   NOTE: GitHub Pages is public, so this is a UI gate only.
   Firebase Authentication + admins/{uid} protect real database writes. */
const OWNER_ADMIN_PASSWORD="281888$";
const SELLER_USERNAME="sky_dooper";

const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand()}catch(e){}

const state={
  page:"home",lang:localStorage.getItem("bdu_lang")||"en",search:"",
  category:"",sort:"new",products:[],categories:[],orders:[],reviews:[],
  cart:JSON.parse(localStorage.getItem("bdu_cart")||"[]"),
  currentUser:null,admin:false,adminTab:"dashboard",loading:true
};

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const t=(en,am)=>state.lang==="am"?am:en;
const money=n=>new Intl.NumberFormat("en-US").format(Number(n)||0)+" ETB";
const tgUser=()=>tg?.initDataUnsafe?.user||null;
const nameOf=p=>state.lang==="am"?(p.nameAm||p.nameEn||"Product"):(p.nameEn||p.nameAm||"Product");
const descOf=p=>state.lang==="am"?(p.descriptionAm||p.descriptionEn||""):(p.descriptionEn||p.descriptionAm||"");
const catName=c=>state.lang==="am"?(c.nameAm||c.nameEn):(c.nameEn||c.nameAm);

function toast(msg){
  const r=$("toastRoot");r.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>r.innerHTML="",2800);
}
function modal(html){$("modalRoot").innerHTML=html}
function closeModal(){$("modalRoot").innerHTML=""}
window.closeModal=closeModal;

function getCartItems(){
  return state.cart.map(x=>({qty:x.qty,p:state.products.find(p=>p.id===x.id)})).filter(x=>x.p);
}
function cartCount(){return state.cart.reduce((a,x)=>a+Number(x.qty||0),0)}
function saveCart(){localStorage.setItem("bdu_cart",JSON.stringify(state.cart))}
function addCart(id,qty=1){
  const p=state.products.find(x=>x.id===id);if(!p)return;
  if(!p.active||Number(p.stock)<=0){toast(t("Out of stock","ከክምችት ውጭ"));return}
  const row=state.cart.find(x=>x.id===id);
  if(row)row.qty=Math.min(Number(p.stock),row.qty+qty);else state.cart.push({id,qty});
  saveCart();render();toast(t("Added to cart","ወደ ጋሪ ተጨምሯል"));
}
function removeCart(id){state.cart=state.cart.filter(x=>x.id!==id);saveCart();render()}
function changeQty(id,d){
  const row=state.cart.find(x=>x.id===id),p=state.products.find(x=>x.id===id);if(!row||!p)return;
  row.qty=Math.max(0,Math.min(Number(p.stock)||1,row.qty+d));if(row.qty===0)removeCart(id);else{saveCart();render()}
}

function stars(n){
  n=Number(n)||0;return "★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n));
}
function avgRating(pid){
  const a=state.reviews.filter(r=>r.productId===pid);
  if(!a.length)return 0;return a.reduce((s,r)=>s+Number(r.rating||0),0)/a.length;
}
function filteredProducts(){
  let a=state.products.filter(p=>p.active);
  if(state.category)a=a.filter(p=>p.category===state.category);
  if(state.search){
    const q=state.search.toLowerCase();
    a=a.filter(p=>(p.nameEn+" "+p.nameAm+" "+p.descriptionEn+" "+p.descriptionAm).toLowerCase().includes(q));
  }
  if(state.sort==="priceLow")a.sort((x,y)=>x.price-y.price);
  else if(state.sort==="priceHigh")a.sort((x,y)=>y.price-x.price);
  else if(state.sort==="rating")a.sort((x,y)=>avgRating(y.id)-avgRating(x.id));
  else a.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
  return a;
}

function productCard(p){
  const rating=avgRating(p.id),cat=state.categories.find(c=>c.id===p.category);
  return `<article class="product">
    <div class="productimg" onclick="window.openProduct('${p.id}')">
      ${p.imageUrl?`<img loading="lazy" src="${esc(p.imageUrl)}" alt="${esc(nameOf(p))}">`:`<div style="height:100%;display:grid;place-items:center;font-size:48px">🛍️</div>`}
      ${p.featured?'<span class="badge">⭐ FEATURED</span>':''}
      ${Number(p.stock)<=0?'<div class="stockout">'+t("Out of stock","ከክምችት ውጭ")+'</div>':''}
    </div>
    <div class="productbody">
      <div class="productname">${esc(nameOf(p))}</div>
      <div class="price">${money(p.price)}</div>
      <div class="meta">${esc(cat?catName(cat):t("Product","ምርት"))} · <span class="rating">${stars(rating)}</span> ${rating?rating.toFixed(1):"—"}</div>
      <button class="add" ${Number(p.stock)<=0?"disabled":""} onclick="window.addCart('${p.id}')">${t("＋ Add to cart","＋ ወደ ጋሪ")}</button>
    </div>
  </article>`;
}

function header(){
  const u=tgUser(),display=u?(u.first_name||u.username||"Student"):"Student";
  return `<header class="topbar">
    <div class="brandrow">
      <div class="brand">
        <div class="logo">BDU</div>
        <div><h1>BDU Market</h1><small>${t("Bahir Dar University marketplace","የባሕር ዳር ዩኒቨርሲቲ ገበያ")}</small></div>
      </div>
      <div class="topactions">
        <button class="iconbtn admin-icon" title="Admin" onclick="window.openAdminLogin()">🔐</button>
        <button class="iconbtn" title="English / Amharic" onclick="window.toggleLang()">አማ</button>
      </div>
    </div>
    ${state.page!=="admin"?`<div class="search"><input id="searchInput" value="${esc(state.search)}" placeholder="${t("Search products...","ምርቶችን ይፈልጉ...")}"><span>⌕</span></div>`:""}
  </header>`;
}

function homePage(){
  const a=filteredProducts(),featured=a.filter(p=>p.featured),shownFeatured=featured.length?featured.slice(0,4):a.slice(0,4);
  return `<main>
    <section class="hero"><h2>${t("Student life. Better shopping.","የተማሪ ሕይወት። ቀላል ግዢ።")}</h2>
      <p>${t("Affordable educational materials, beauty products and electronics for BDU students.","ለBDU ተማሪዎች ተመጣጣኝ የትምህርት እቃዎች፣ የውበት ምርቶች እና ኤሌክትሮኒክስ።")}</p>
      <button class="heroaction" onclick="window.setPage('categories')">${t("Explore products","ምርቶችን ይመልከቱ")} →</button>
    </section>
    <div class="sectionhead"><h2>${t("Categories","ምድቦች")}</h2><button onclick="window.setPage('categories')">${t("See all","ሁሉንም")}</button></div>
    <div class="cats"><button class="cat ${!state.category?"active":""}" onclick="window.filterCategory('')">✨ ${t("All","ሁሉም")}</button>
      ${state.categories.filter(c=>c.active!==false).map(c=>`<button class="cat ${state.category===c.id?"active":""}" onclick="window.filterCategory('${c.id}')">${esc(c.icon||"🛍️")} ${esc(catName(c))}</button>`).join("")}
    </div>
    <div class="sectionhead"><h2>⭐ ${t("Featured","ተመራጭ")}</h2><button onclick="window.setPage('categories')">${t("More","ተጨማሪ")}</button></div>
    ${shownFeatured.length?`<div class="grid">${shownFeatured.map(productCard).join("")}</div>`:'<div class="empty"><div class="big">🛍️</div>'+t("Products are coming soon.","ምርቶች በቅርቡ ይመጣሉ።")+'</div>'}
    <div class="sectionhead"><h2>🆕 ${t("New products","አዳዲስ ምርቶች")}</h2></div>
    <div class="grid">${a.slice(0,6).map(productCard).join("")||'<div class="empty" style="grid-column:1/-1">'+t("No products found.","ምንም ምርት አልተገኘም።")+'</div>'}</div>
  </main>`;
}

function categoriesPage(){
  return `<main><h2 class="pageTitle">${t("Categories","ምድቦች")}</h2>
    <div class="cats" style="margin-bottom:15px"><button class="cat ${!state.category?"active":""}" onclick="window.filterCategory('')">✨ ${t("All","ሁሉም")}</button>
    ${state.categories.filter(c=>c.active!==false).map(c=>`<button class="cat ${state.category===c.id?"active":""}" onclick="window.filterCategory('${c.id}')">${esc(c.icon||"🛍️")} ${esc(catName(c))}</button>`).join("")}</div>
    <div class="sectionhead"><h2>${state.category?(esc(catName(state.categories.find(c=>c.id===state.category)||{}))):t("All products","ሁሉም ምርቶች")}</h2>
      <select onchange="window.changeSort(this.value)" style="border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;font-size:11px">
        <option value="new" ${state.sort==="new"?"selected":""}>${t("Newest","አዳዲስ")}</option>
        <option value="priceLow" ${state.sort==="priceLow"?"selected":""}>${t("Price low","ዝቅተኛ ዋጋ")}</option>
        <option value="priceHigh" ${state.sort==="priceHigh"?"selected":""}>${t("Price high","ከፍተኛ ዋጋ")}</option>
        <option value="rating" ${state.sort==="rating"?"selected":""}>${t("Rating","ደረጃ")}</option>
      </select>
    </div>
    <div class="grid">${filteredProducts().map(productCard).join("")||'<div class="empty" style="grid-column:1/-1"><div class="big">🔎</div>'+t("No products found.","ምንም ምርት አልተገኘም።")+'</div>'}</div>
  </main>`;
}

function cartPage(){
  const items=getCartItems();const total=items.reduce((s,x)=>s+x.p.price*x.qty,0);
  return `<main><h2 class="pageTitle">${t("Your Cart","የእርስዎ ጋሪ")} ${cartCount()?`(${cartCount()})`:""}</h2>

function render(){
  const appEl=$("app");
  let body="";
  if(state.loading)body=`<main><div class="skeleton"></div><div class="skeleton" style="margin-top:12px;height:180px"></div></main>`;
  else if(state.page==="home")body=homePage();
  else if(state.page==="categories")body=categoriesPage();
  else if(state.page==="cart")body=cartPage();
  else if(state.page==="orders")body=ordersPage();
  else if(state.page==="profile")body=profilePage();
  else if(state.page==="admin")body=adminPage();
  appEl.innerHTML=header()+body+(state.page!=="admin"?`<nav class="bottomnav">
    ${[
      ["home","⌂",t("Home","መነሻ")],["categories","▦",t("Categories","ምድቦች")],["cart","🛒",t("Cart","ጋሪ")],["orders","📦",t("Orders","ትዕዛዞች")],["profile","◉",t("Profile","መገለጫ")]
    ].map(x=>`<button class="navbtn ${state.page===x[0]?"active":""}" onclick="window.setPage('${x[0]}')"><span class="ni">${x[1]}${x[0]==="cart"&&cartCount()?`<sup style="font-size:9px">${cartCount()}</sup>`:""}</span>${x[2]}</button>`).join("")}</nav>`:"");
  const sb=$("searchInput");if(sb)sb.oninput=e=>{state.search=e.target.value;render();const n=$("searchInput");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
}

window.setPage=p=>{state.page=p;state.search="";render();window.scrollTo(0,0)};

window.addCart=addCart;window.removeCart=removeCart;window.changeQty=changeQty;

window.openProduct=pid=>{
  const p=state.products.find(x=>x.id===pid);if(!p)return;
  const reviews=state.reviews.filter(r=>r.productId===pid).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));

  modal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>${esc(nameOf(p))}</h2><button class="close" onclick="closeModal()">×</button></div>
  ${p.imageUrl?`<img class="detailimg" src="${esc(p.imageUrl)}">`:`<div class="detailimg" style="height:260px;display:grid;place-items:center;font-size:70px">🛍️</div>`}
  <div class="detailprice">${money(p.price)}</div><div class="meta">${esc(state.categories.find(c=>c.id===p.category)?catName(state.categories.find(c=>c.id===p.category)):t("Product","ምርት"))} · <span class="rating">${stars(rating)}</span> ${rating?rating.toFixed(1):"No rating"}</div>
  <p class="detaildesc">${esc(descOf(p))||t("No description yet.","ምንም መግለጫ የለም።")}</p>

  <div class="split" style="margin-top:10px"><button class="secondary" onclick="window.addCart('${p.id}');closeModal()">${t("Add to cart","ወደ ጋሪ")}</button><button class="primary" onclick="window.buyNow('${p.id}')">${t("Buy now","አሁን ይግዙ")}</button></div>
  <div class="sectionhead"><h2>⭐ ${t("Reviews","ግምገማዎች")} (${reviews.length})</h2><button onclick="window.openReview('${p.id}')">＋</button></div>
  <div class="list">${reviews.map(r=>`<div class="ordercard"><div class="rating">${stars(r.rating)}</div><b>${esc(r.userName||"Student")}</b><div class="detaildesc">${esc(r.comment)}</div></div>`).join("")||'<div class="empty" style="padding:20px">'+t("No reviews yet. Be the first!","እርስዎ የመጀመሪያው ግምገማ ይሁኑ!")+'</div>'}</div>
  </div></div>`);
};

window.buyNow=pid=>{addCart(pid);window.checkout()};
window.checkout=()=>{
  const items=getCartItems();if(!items.length){toast(t("Cart is empty","ጋሪው ባዶ ነው"));return}
  const total=items.reduce((s,x)=>s+x.p.price*x.qty,0),u=tgUser();
  modal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>🧾 ${t("Checkout","ግዢ መጨረሻ")}</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="totalbox"><span>${t("Order total","ጠቅላላ የትዕዛዝ ዋጋ")}</span><span>${money(total)}</span></div>
  <form id="checkoutForm" class="form" style="margin-top:12px">
    <div class="field"><label>${t("Full name","ሙሉ ስም")}</label><input name="fullName" required value="${esc([u?.first_name,u?.last_name].filter(Boolean).join(" "))}"></div>
    <div class="field"><label>${t("University ID","የዩኒቨርሲቲ መታወቂያ")}</label><input name="universityId" required placeholder="e.g. BDU/1234/22"></div>
    <div class="field"><label>Telegram username</label><input name="username" required value="${esc(u?.username||"")}"></div>
    <div class="split"><div class="field"><label>${t("Dorm / Block","ዶርም / ብሎክ")}</label><input name="dorm" required></div><div class="field"><label>${t("Room number","የክፍል ቁጥር")}</label><input name="room" required></div></div>
    <div class="field"><label>${t("Phone number","ስልክ ቁጥር")}</label><input name="phone" required inputmode="tel"></div>
    <div class="field"><label>${t("Order notes","የትዕዛዝ ማስታወሻ")}</label><textarea name="notes" placeholder="${t("Optional","አማራጭ")}"></textarea></div>
    <div class="notice">${items.map(x=>`${esc(nameOf(x.p))} × ${x.qty} = ${money(x.p.price*x.qty)}`).join("<br>")}<br><br>${t("Payment is not processed by this app. Contact @sky_dooper after placing the order.","ክፍያ በዚህ መተግበሪያ አይከናወንም። ትዕዛዙን ካስገቡ በኋላ @sky_dooper ያግኙ።")}</div>
    <button class="primary" style="width:100%">${t("Place order","ትዕዛዝ ያስገቡ")} ✓</button>
  </form></div></div>`);
  $("checkoutForm").onsubmit=async e=>{
    e.preventDefault();if(!auth.currentUser){toast(t("Please wait for connection","እባክዎ ግንኙነቱን ይጠብቁ"));return}
    const fd=new FormData(e.target),customer=Object.fromEntries(fd.entries());
    const orderNo="BDU-"+Date.now().toString(36).toUpperCase();
    const order={orderNo,ownerUid:auth.currentUser.uid,telegramId:u?.id?String(u.id):"",telegramUsername:u?.username||String(customer.username).replace(/^@/,""),
      customer,items:items.map(x=>({id:x.p.id,name:nameOf(x.p),price:Number(x.p.price),qty:x.qty})),total,status:"pending",createdAt:serverTimestamp()};
    try{
      await addDoc(collection(db,"orders"),order);
      state.cart=[];saveCart();closeModal();setPage("orders");
      modal(`<div class="modal"><div class="sheet"><div class="form" style="text-align:center"><div style="font-size:55px">🎉</div>
      <h2>${t("Order placed!","ትዕዛዝ ተሳክቷል!")}</h2><p>${t("Order number","የትዕዛዝ ቁጥር")}: <b>${orderNo}</b></p>
      <p class="detaildesc">${t("Contact the seller to confirm availability, payment and delivery.","ተገኝነትን፣ ክፍያን እና መላኪያን ለማረጋገጥ ሻጩን ያግኙ።")}</p>
      <button class="primary" style="width:100%" onclick="window.openSeller()">${t("Contact @sky_dooper","@sky_dooper ያግኙ")}</button>
      <button class="secondary" style="width:100%" onclick="closeModal()">${t("Done","ተጠናቋል")}</button></div></div></div>`);
    }catch(err){console.error(err);toast(t("Could not place order","ትዕዛዙን ማስገባት አልተቻለም"))}
  };
};

window.openReview=pid=>{
  const u=tgUser();
  modal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>⭐ ${t("Write a review","ግምገማ ይጻፉ")}</h2><button class="close" onclick="closeModal()">×</button></div>
  <form id="reviewForm" class="form"><div class="field"><label>${t("Rating","ደረጃ")}</label><select name="rating"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select></div>
  <div class="field"><label>${t("Comment","አስተያየት")}</label><textarea name="comment" required minlength="2"></textarea></div><button class="primary">${t("Submit review","ግምገማ ላክ")}</button></form></div></div>`);

  modal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>🔐 BDU Market Admin</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="notice">Enter the owner password first. Firebase Authentication then verifies your administrator account before any product, category, image or order changes are allowed.</div>

  <button class="primary" style="width:100%">🔓 Continue</button></form></div></div>`);
  $("ownerGate").onsubmit=async e=>{
    e.preventDefault();const pw=new FormData(e.target).get("pw");
    if(pw!==OWNER_ADMIN_PASSWORD){toast(t("Incorrect admin password","የአስተዳዳሪ ይለፍ ቃል ልክ አይደለም"));return}
    if(state.admin){closeModal();state.page="admin";state.adminTab="dashboard";render();return}
    modal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>🛡️ Firebase Admin Login</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="notice">Password accepted. Now use the administrator email and password created in Firebase Authentication.</div>
    <form id="adminAuthForm" class="form"><div class="field"><label>Email</label><input name="email" type="email" required></div>
    <div class="field"><label>Password</label><input name="pass" type="password" required></div><button class="primary">Login to Admin</button></form></div></div>`);
    $("adminAuthForm").onsubmit=async ev=>{
      ev.preventDefault();const f=new FormData(ev.target);
      try{await signInWithEmailAndPassword(auth,f.get("email"),f.get("pass"));closeModal();state.page="admin";state.adminTab="dashboard";render()}
      catch(err){console.error(err);toast(t("Firebase login failed","የFirebase መግቢያ አልተሳካም"))}
    };
  };
};

window.adminLogout=async()=>{await signOut(auth);state.admin=false;state.page="home";render();toast(t("Logged out","ወጥተዋል"))};
window.adminTab=tab=>{if(!state.admin)return;state.adminTab=tab;render()};

window.adminProductForm=pid=>{
  if(!state.admin)return;
  const p=pid?state.products.find(x=>x.id===pid):null;
  modal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>${p?"✏️ "+t("Edit product","ምርት አስተካክል"):"＋ "+t("Add product","ምርት ጨምር")}</h2><button class="close" onclick="closeModal()">×</button></div>
  <form id="productForm" class="form">
    <div class="field"><label>English name</label><input name="nameEn" required value="${esc(p?.nameEn||"")}"></div>
    <div class="field"><label>Amharic name</label><input name="nameAm" class="am" value="${esc(p?.nameAm||"")}"></div>
    <div class="split"><div class="field"><label>Price (ETB)</label><input name="price" type="number" min="0" step="0.01" required value="${esc(p?.price??"")}"></div>
    <div class="field"><label>Stock</label><input name="stock" type="number" min="0" step="1" required value="${esc(p?.stock??0)}"></div></div>
    <div class="field"><label>Category</label><select name="category" required>${state.categories.map(c=>`<option value="${c.id}" ${p?.category===c.id?"selected":""}>${esc(c.icon||"")} ${esc(catName(c))}</option>`).join("")}</select></div>
    <div class="field"><label>English description</label><textarea name="descriptionEn">${esc(p?.descriptionEn||"")}</textarea></div>
    <div class="field"><label>Amharic description</label><textarea name="descriptionAm" class="am">${esc(p?.descriptionAm||"")}</textarea></div>
    <div class="field"><label>Product image</label><input id="productImage" name="image" type="file" accept="image/*"><img id="imagePreview" class="preview" src="${esc(p?.imageUrl||"")}"></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:12px"><input name="featured" type="checkbox" ${p?.featured?"checked":""}> ⭐ Featured</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:12px"><input name="active" type="checkbox" ${p?.active!==false?"checked":""}> ✅ Visible to students</label>
    <button class="primary">${p?t("Save changes","ለውጦችን አስቀምጥ"):t("Create product","ምርት ፍጠር")}</button>
  </form></div></div>`);
  const img=$("productImage"),prev=$("imagePreview");
  img.onchange=()=>{const f=img.files?.[0];if(f){prev.src=URL.createObjectURL(f);prev.style.display="block"}};
  if(p?.imageUrl)prev.style.display="block";
  $("productForm").onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);let imageUrl=p?.imageUrl||"";
    try{
      const file=fd.get("image");
      if(file&&file.size){
        const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
        const path=`products/${Date.now()}_${safe}`;
        const rr=ref(storage,path);
        await uploadBytes(rr,file,{contentType:file.type});
        imageUrl=await getDownloadURL(rr);
      }
      const data={nameEn:String(fd.get("nameEn")),nameAm:String(fd.get("nameAm")||""),price:Number(fd.get("price")||0),
        stock:Number(fd.get("stock")||0),category:String(fd.get("category")),descriptionEn:String(fd.get("descriptionEn")||""),
        descriptionAm:String(fd.get("descriptionAm")||""),imageUrl,featured:fd.get("featured")==="on",active:fd.get("active")==="on",
        updatedAt:serverTimestamp()};
      if(p)await updateDoc(doc(db,"products",p.id),data);else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});
      closeModal();toast(t("Product saved","ምርቱ ተቀምጧል"));render();
    }catch(err){console.error(err);toast(t("Could not save product. Check Firebase rules.","ምርቱን ማስቀመጥ አልተቻለም።"))}
  };
};

window.deleteProduct=async pid=>{
  if(!state.admin)return;const p=state.products.find(x=>x.id===pid);if(!p)return;
  if(!confirm(t("Delete this product?","ይህን ምርት ማጥፋት ይፈልጋሉ?")))return;
  try{await deleteDoc(doc(db,"products",pid));toast(t("Product deleted","ምርቱ ተሰርዟል"));render()}catch(e){console.error(e);toast(t("Delete failed","መሰረዝ አልተሳካም"))}
};

window.adminCategoryForm=cid=>{
  const c=cid?state.categories.find(x=>x.id===cid):null;
  modal(`<div class="modal"><div class="sheet"><div class="sheettop"><h2>${c?"✏️ ":"＋ "}${t("Category","ምድብ")}</h2><button class="close" onclick="closeModal()">×</button></div>
  <form id="categoryForm" class="form"><div class="field"><label>English name</label><input name="nameEn" required value="${esc(c?.nameEn||"")}"></div>
  <div class="field"><label>Amharic name</label><input name="nameAm" class="am" value="${esc(c?.nameAm||"")}"></div>
  <div class="field"><label>Icon / emoji</label><input name="icon" value="${esc(c?.icon||"🛍️")}"></div>
  <label style="display:flex;gap:8px;align-items:center;font-size:12px"><input name="active" type="checkbox" ${c?.active!==false?"checked":""}> ${t("Enabled","ንቁ")}</label>
  <button class="primary">${t("Save category","ምድቡን አስቀምጥ")}</button></form></div></div>`);
  $("categoryForm").onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);const data={nameEn:String(fd.get("nameEn")),nameAm:String(fd.get("nameAm")||""),icon:String(fd.get("icon")||"🛍️"),active:fd.get("active")==="on",updatedAt:serverTimestamp()};
    try{if(c)await updateDoc(doc(db,"categories",c.id),data);else await addDoc(collection(db,"categories"),{...data,createdAt:serverTimestamp()});
      closeModal();toast(t("Category saved","ምድቡ ተቀምጧል"));render()}catch(err){console.error(err);toast(t("Category save failed","ምድቡን ማስቀመጥ አልተሳካም"))}
  };
};

window.deleteCategory=async cid=>{
  const used=state.products.some(p=>p.category===cid);
  if(used){toast(t("Cannot delete a category used by products. Disable it instead.","በምርቶች የተጠቀሰ ምድብ መሰረዝ አይቻልም። ያሰናክሉት።"));return}
  if(!confirm(t("Delete category?","ምድቡን ይሰርዙ?")))return;
  try{await deleteDoc(doc(db,"categories",cid));toast(t("Category deleted","ምድቡ ተሰርዟል"));render()}catch(e){console.error(e);toast(t("Delete failed","መሰረዝ አልተሳካም"))}
};

window.updateOrderStatus=async(id,status)=>{
  if(!state.admin)return;
  try{await updateDoc(doc(db,"orders",id),{status,updatedAt:serverTimestamp()});toast(t("Order updated","ትዕዛዙ ተዘምኗል"))}
  catch(e){console.error(e);toast(t("Could not update order","ትዕዛዙን ማዘመን አልተቻለም"))}
};

/* Firebase live data */
function subscribe(){
  onSnapshot(collection(db,"products"),snap=>{
    state.products=snap.docs.map(d=>({id:d.id,...d.data()}));state.loading=false;render()
  },err=>{console.error("products",err);state.loading=false;render()});
  onSnapshot(collection(db,"categories"),snap=>{
    state.categories=snap.docs.map(d=>({id:d.id,...d.data()}));render()
  },err=>console.error("categories",err));
  onSnapshot(collection(db,"reviews"),snap=>{
    state.reviews=snap.docs.map(d=>({id:d.id,...d.data()}));render()
  },err=>console.error("reviews",err));
  onSnapshot(collection(db,"orders"),snap=>{
    state.orders=snap.docs.map(d=>({id:d.id,...d.data()}));render()
  },err=>console.error("orders",err));
}

/* Default categories are created only after an authenticated admin logs in. */
async function seedDefaults(){
  if(!state.admin)return;
  if(state.categories.length)return;
  const defaults=[
    {nameEn:"Educational Materials",nameAm:"የትምህርት እቃዎች",icon:"📚",active:true},
    {nameEn:"Cosmetics & Beauty",nameAm:"ኮስሜቲክስ እና ውበት",icon:"💄",active:true},
    {nameEn:"Electronics",nameAm:"ኤሌክትሮኒክስ",icon:"🎧",active:true},
    {nameEn:"Stationery",nameAm:"የጽሕፈት መሳሪያዎች",icon:"✏️",active:true},
    {nameEn:"Other",nameAm:"ሌሎች",icon:"🛍️",active:true}
  ];
  for(const c of defaults)await addDoc(collection(db,"categories"),{...c,createdAt:serverTimestamp()});
}

onAuthStateChanged(auth,async user=>{
  state.currentUser=user||null;
  state.admin=false;
  if(user){
    try{
      const a=await getDoc(doc(db,"admins",user.uid));
      if(a.exists()&&a.data().active===true){
        state.admin=true;
        await seedDefaults();
      }
    }catch(e){console.error("Admin verification",e)}
  }
  render();
});

/* Startup: anonymous sign-in lets students securely create their own orders/reviews. */
(async function init(){
  render();
  subscribe();
  try{if(!auth.currentUser)await signInAnonymously(auth)}
  catch(e){console.warn("Enable Anonymous Authentication in Firebase:",e)}
})();
</script>
