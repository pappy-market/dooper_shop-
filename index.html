<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BDU Market</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#f7f8fc;
  --fg:#171923;
  --muted:#74798b;
  --line:#e7e9f0;
  --card:#fff;
  --soft:#f0f2f8;
  --accent:#6c5ce7;
  --accent2:#00b894;
  --accent3:#ff7675;
  --accent4:#0984e3;
  --danger:#e74c3c;
  --shadow:0 8px 25px rgba(30,35,70,.08);
  --radius:20px;
}

body.dark{
  --bg:#101116;
  --fg:#f5f6fa;
  --muted:#9da1b1;
  --line:#292c36;
  --card:#191b22;
  --soft:#22252e;
  --shadow:0 8px 25px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
  "Noto Sans Ethiopic",sans-serif;
  background:var(--bg);
  color:var(--fg);
  padding-bottom:82px;
  transition:background .3s,color .3s;
  -webkit-tap-highlight-color:transparent;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

img{
  max-width:100%;
  display:block;
}

.hidden{
  display:none!important;
}

/* HEADER */

.app-header{
  position:sticky;
  top:0;
  z-index:50;
  padding:13px 16px 12px;
  background:rgba(247,248,252,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

body.dark .app-header{
  background:rgba(16,17,22,.88);
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.7px;
  background:linear-gradient(90deg,var(--accent),var(--accent4),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.lang-toggle{
  display:flex;
  background:var(--soft);
  border-radius:30px;
  padding:3px;
}

.lang-toggle button{
  padding:6px 11px;
  border-radius:22px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.lang-toggle button.active{
  background:var(--accent);
  color:#fff;
  box-shadow:0 4px 12px rgba(108,92,231,.3);
}

.search-bar{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:12px;
  padding:11px 14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
}

.search-bar input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--fg);
  font-size:14px;
}

/* PAGES */

.page{
  display:none;
  animation:pageIn .3s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* CATEGORY */

.cat-scroll{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:15px 16px 10px;
  scrollbar-width:none;
}

.cat-scroll::-webkit-scrollbar{
  display:none;
}

.cat-chip{
  flex:0 0 auto;
  padding:9px 15px;
  border:1px solid var(--line);
  border-radius:25px;
  background:var(--card);
  color:var(--fg);
  font-size:12px;
  font-weight:700;
  transition:.2s;
}

.cat-chip:active{
  transform:scale(.94);
}

.cat-chip.active{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(135deg,var(--accent),#8e7dff);
  box-shadow:0 6px 15px rgba(108,92,231,.25);
}

/* SECTION */

.section{
  padding:8px 16px 20px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:17px;
  font-weight:850;
}

/* PRODUCT GRID */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

/* PRODUCT CARD */

.pcard{
  position:relative;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:21px;
  box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s;
}

.pcard:active{
  transform:scale(.97);
}

.pcard .img-wrap{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:var(--soft);
}

.pcard img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .45s ease;
}

.pcard:hover img{
  transform:scale(1.06);
}

.product-gradient{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:50%;
  background:linear-gradient(transparent,rgba(0,0,0,.3));
  pointer-events:none;
}

.pcard .body{
  padding:11px 12px 13px;
}

.pcard .name{
  font-size:14px;
  font-weight:750;
  line-height:1.35;
  margin-bottom:6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.pcard .price{
  font-size:16px;
  font-weight:900;
  color:var(--accent);
  margin-bottom:5px;
}

.pcard .meta{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:10px;
  margin-bottom:9px;
}

.stock-badge{
  padding:3px 7px;
  border-radius:9px;
  background:#e8fff7;
  color:#00a67d;
  font-weight:700;
}

body.dark .stock-badge{
  background:#15382f;
}

.stock-badge.out{
  background:#ffe9e7;
  color:var(--danger);
}

.add-btn{
  width:100%;
  padding:9px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#8172ed);
  color:white;
  font-weight:800;
  font-size:12px;
  box-shadow:0 5px 12px rgba(108,92,231,.22);
  transition:.2s;
}

.add-btn:active{
  transform:scale(.96);
}

.add-btn:disabled{
  background:var(--soft);
  color:var(--muted);
  box-shadow:none;
}

/* LOADING */

.skeleton{
  background:linear-gradient(
    90deg,
    var(--soft) 25%,
    var(--line) 37%,
    var(--soft) 63%
  );
  background-size:400% 100%;
  animation:shine 1.4s infinite;
}

@keyframes shine{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}

.skel-card{
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--card);
}

.skel-card .img-wrap{
  aspect-ratio:1;
}

.skel-line{
  height:12px;
  margin:9px 12px;
  border-radius:8px;
}

/* EMPTY */

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.empty-state .icon{
  font-size:48px;
  margin-bottom:10px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  height:66px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border:1px solid var(--line);
  border-radius:23px;
  display:flex;
  z-index:60;
  box-shadow:0 10px 35px rgba(20,25,50,.15);
}

body.dark .bottom-nav{
  background:rgba(25,27,34,.94);
}

.bottom-nav button{
  position:relative;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:650;
}

.bottom-nav button.active{
  color:var(--accent);
}

.nav-icon{
  font-size:20px;
  transition:.2s;
}

.bottom-nav button.active .nav-icon{
  transform:translateY(-2px) scale(1.08);
}

.cart-count{
  position:absolute;
  top:5px;
  right:19%;
  min-width:17px;
  height:17px;
  padding:0 4px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:var(--accent3);
  color:white;
  font-size:9px;
  font-weight:900;
  border:2px solid var(--card);
}

/* SHEET */

.sheet-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.sheet-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-height:94vh;
  overflow-y:auto;
  background:var(--card);
  z-index:101;
  border-radius:25px 25px 0 0;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}

.sheet.show{
  transform:translateY(0);
}

.sheet-handle{
  width:42px;
  height:4px;
  margin:10px auto;
  background:var(--line);
  border-radius:10px;
}

.sheet-close{
  position:absolute;
  right:14px;
  top:12px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  color:white;
  z-index:5;
}

.pd-gallery{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
}

.pd-gallery img{
  width:100%;
  flex:0 0 100%;
  aspect-ratio:1;
  object-fit:cover;
  scroll-snap-align:start;
}

.pd-body{
  padding:18px;
}

.pd-name{
  font-size:22px;
  font-weight:900;
  margin-bottom:6px;
}

.pd-price{
  color:var(--accent);
  font-size:23px;
  font-weight:900;
  margin-bottom:8px;
}

.pd-meta{
  display:flex;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  margin-bottom:16px;
}

.pd-desc{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
  margin-bottom:18px;
}

.qty-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

.qty-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--fg);
  font-size:20px;
}

.pd-actions{
  display:flex;
  gap:10px;
  margin-bottom:24px;
}

.btn{
  padding:13px;
  border-radius:14px;
  font-size:14px;
  font-weight:800;
  flex:1;
}

.btn-solid{
  color:white;
  background:linear-gradient(135deg,var(--accent),#8172ed);
  box-shadow:0 7px 17px rgba(108,92,231,.25);
}

.btn-outline{
  color:var(--accent);
  background:var(--card);
  border:1.5px solid var(--accent);
}

/* CART */

.cart-item{
  display:flex;
  gap:12px;
  padding:14px 16px;
  background:var(--card);
  border-bottom:1px solid var(--line);
}

.cart-item img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:15px;
}

.cart-item .info{
  flex:1;
}

.cart-item .name{
  font-size:14px;
  font-weight:800;
  margin-bottom:5px;
}

.cart-item .price{
  color:var(--accent);
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.cart-qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.cart-qty button{
  width:28px;
  height:28px;
  border-radius:9px;
  background:var(--soft);
  color:var(--fg);
}

.cart-remove{
  color:var(--danger);
  font-size:11px;
  margin-top:5px;
}

.cart-summary{
  margin:12px;
  padding:17px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:14px;
}

.summary-row.total{
  font-size:18px;
  font-weight:900;
  padding-top:10px;
  border-top:1px solid var(--line);
}

/* PROFILE */

.profile-hero{
  position:relative;
  margin:15px 16px;
  padding:23px 18px;
  overflow:hidden;
  border-radius:25px;
  background:linear-gradient(135deg,#6c5ce7,#0984e3);
  color:#fff;
  box-shadow:0 12px 30px rgba(73,77,200,.25);
}

.profile-hero:after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  right:-40px;
  top:-50px;
  background:rgba(255,255,255,.13);
}

.profile-row{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar-circle{
  width:62px;
  height:62px;
  flex:0 0 62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.45);
  font-size:24px;
  font-weight:900;
}

.profile-menu{
  margin:0 16px;
  overflow:hidden;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.list-link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:54px;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  font-weight:650;
  cursor:pointer;
}

.list-link:last-child{
  border-bottom:0;
}

.list-link .left{
  display:flex;
  align-items:center;
  gap:12px;
}

.list-icon{
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:var(--soft);
  font-size:17px;
}

/* THEME SWITCH */

.theme-switch{
  width:49px;
  height:28px;
  border-radius:20px;
  background:var(--soft);
  padding:3px;
  transition:.25s;
}

.theme-switch span{
  display:block;
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--card);
  box-shadow:0 2px 5px rgba(0,0,0,.18);
  transition:.25s;
}

body.dark .theme-switch{
  background:var(--accent);
}

body.dark .theme-switch span{
  transform:translateX(21px);
}

/* FORMS */

.form-group{
  padding:0 16px 14px;
}

.form-group label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border-radius:13px;
  border:1px solid var(--line);
  outline:0;
  background:var(--card);
  color:var(--fg);
  font-size:14px;
}

.order-summary-box{
  margin:0 16px 16px;
  padding:15px;
  border-radius:17px;
  border:1px solid var(--line);
  background:var(--soft);
}

/* REVIEWS */

.review-item{
  padding:13px 0;
  border-top:1px solid var(--line);
}

.stars{
  color:#ffb400;
}

.review-form textarea{
  width:100%;
  margin-top:8px;
  padding:11px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--fg);
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  z-index:200;
  max-width:85%;
  padding:11px 17px;
  border-radius:20px;
  background:#171923;
  color:#fff;
  font-size:13px;
  font-weight:650;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* CONFIRM */

.confirm-box{
  padding:65px 24px;
  text-align:center;
}

.confirm-box .check{
  font-size:60px;
  margin-bottom:14px;
  animation:pop .5s ease;
}

@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  70%{transform:scale(1.15)}
  100%{transform:scale(1)}
}

.order-num{
  margin:12px 0;
  font-size:21px;
  font-weight:900;
}

/* RESPONSIVE */

@media(min-width:600px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .app-header,
  .cat-scroll,
  .section{
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
  }

  .bottom-nav{
    max-width:600px;
    left:50%;
    right:auto;
    width:600px;
    transform:translateX(-50%);
  }
}
</style>
</head>

<body>

<header class="app-header">
  <div class="header-row">
    <div class="logo">BDU Market</div>

    <div class="lang-toggle">
      <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
      <button id="lang-am" onclick="setLang('am')">አማ</button>
    </div>
  </div>

  <div class="search-bar">
    <span>🔍</span>
    <input
      id="search-input"
      data-i18n-ph="search_ph"
      placeholder="Search products..."
      oninput="onSearch(this.value)"
    >
  </div>
</header>

<!-- HOME -->

<div class="page active" id="page-home">

  <div class="cat-scroll" id="cat-scroll"></div>

  <div class="section">
    <div class="section-title">
      <h2 data-i18n="featured">Featured</h2>
    </div>
    <div class="grid" id="featured-grid"></div>
  </div>

  <div class="section">
    <div class="section-title">
      <h2 data-i18n="popular">Popular</h2>
    </div>
    <div class="grid" id="popular-grid"></div>
  </div>

  <div class="section">
    <div class="section-title">
      <h2 data-i18n="new_products">New Products</h2>
    </div>
    <div class="grid" id="new-grid"></div>
  </div>

</div>

<!-- CATEGORIES -->

<div class="page" id="page-categories">

  <div class="cat-scroll" id="cat-scroll-2"></div>

  <div class="section">
    <div class="grid" id="category-grid"></div>
  </div>

</div>

<!-- CART -->

<div class="page" id="page-cart">

  <div id="cart-list"></div>

  <div id="cart-summary-wrap"></div>

</div>

<!-- ORDERS -->

<div class="page" id="page-orders">

  <div id="orders-list"></div>

</div>

<!-- PROFILE -->

<div class="page" id="page-profile">

  <div class="profile-hero">

    <div class="profile-row">

      <div class="avatar-circle" id="profile-initial">S</div>

      <div>
        <div
          style="font-size:18px;font-weight:900"
          id="profile-name"
        >
          Student
        </div>

        <div
          style="font-size:12px;opacity:.8"
          id="profile-username"
        >
          @telegram
        </div>
      </div>

    </div>

  </div>

  <div class="profile-menu">

    <div
      class="list-link"
      onclick="showPage('page-orders')"
    >
      <div class="left">
        <div class="list-icon">📦</div>
        <span data-i18n="my_orders">My Orders</span>
      </div>
      <span>›</span>
    </div>

    <div
      class="list-link"
      onclick="setLang(currentLang==='en'?'am':'en')"
    >
      <div class="left">
        <div class="list-icon">🌐</div>
        <span data-i18n="language">Language</span>
      </div>

      <span id="profile-lang-val">English</span>
    </div>

    <!-- THEME BUTTON -->

    <div
      class="list-link"
      onclick="toggleTheme()"
    >

      <div class="left">
        <div class="list-icon" id="theme-icon">🌙</div>

        <span data-i18n="theme">
          Dark Theme
        </span>
      </div>

      <div class="theme-switch">
        <span></span>
      </div>

    </div>

    <div
      class="list-link"
      onclick="openAdminLogin()"
    >
      <div class="left">
        <div class="list-icon">⚙️</div>
        <span data-i18n="admin_panel">Admin Panel</span>
      </div>
      <span>›</span>
    </div>

  </div>

</div>

<!-- CHECKOUT -->

let products=[];
let categories=[];
let activeCategory="all";
let searchTerm="";

);

/* =====================================================
   CART
===================================================== */

function saveCart(){

  localStorage.setItem(
    "bdu_cart",
    JSON.stringify(cart)
  );

  updateCartCount();
}

function updateCartCount(){

  const count=cart.reduce(
    (sum,item)=>sum+(Number(item.qty)||0),
    0
  );

  const el=document.getElementById("cart-count");

  if(!el)return;

  el.textContent=count;

  el.classList.toggle(
    "hidden",
    count===0
  );
}

function addToCart(product,qty=1){

  if(!product)return;

  const stock=Number(
    product.stock ??
    product.quantity ??
    999999
  );

  if(stock<=0){
    showToast(t("out_of_stock"));
    return;
  }

  const id=product.id;

  const existing=cart.find(
    item=>item.id===id
  );

  if(existing){

    existing.qty+=qty;

  }else{

    cart.push({
      id:id,
      name:product.name||"Product",
      price:Number(product.price)||0,
      image:getProductImage(product),
      qty:qty,
      stock:stock
    });

  }

  saveCart();

  showToast("🛒 "+t("add_to_cart"));

  renderCart();
}

function changeCartQty(id,delta){

  const item=cart.find(
    x=>x.id===id
  );

  if(!item)return;

  item.qty+=delta;

  if(item.qty<=0){

    cart=cart.filter(
      x=>x.id!==id
    );

  }

  saveCart();
  renderCart();
}

function removeFromCart(id){

  cart=cart.filter(
    x=>x.id!==id
  );

  saveCart();
  renderCart();
}

function cartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum+
      Number(item.price||0)*
      Number(item.qty||0),
    0
  );

}

/* =====================================================
   PRODUCT IMAGE
===================================================== */

function getProductImage(product){

  if(product.image)
    return product.image;

  if(product.imageUrl)
    return product.imageUrl;

  if(product.images){

    if(Array.isArray(product.images)
       && product.images.length)
      return product.images[0];

    if(typeof product.images==="string")
      return product.images;
  }

  return "https://via.placeholder.com/600?text=BDU+Market";
}

/* =====================================================
   PRODUCT CARD
===================================================== */

function productCard(product){

  const stock=Number(
    product.stock ??
    product.quantity ??
    999999
  );

  const out=stock<=0;

  const image=getProductImage(product);

  const name=
    product.name||
    product.title||
    "Product";

  const price=
    Number(product.price)||0;

  const rating=
    Number(product.rating)||0;

  return `

  <div class="pcard">

    <div
      class="img-wrap"
      onclick="openProductSheet('${escapeId(product.id)}')"
    >

      <img
        src="${escapeHtml(image)}"
        alt=""
        loading="lazy"
        onerror="this.src='https://via.placeholder.com/600?text=BDU+Market'"
      >

      <div class="product-gradient"></div>

    </div>

    <div class="body">

      <div
        class="name"
        onclick="openProductSheet('${escapeId(product.id)}')"
      >
        ${escapeHtml(name)}
      </div>

      <div class="price">
        ${fmtPrice(price)}
      </div>

      <div class="meta">

        <span>
          ⭐ ${rating.toFixed(1)}
        </span>

        <span>•</span>

        <span class="stock-badge ${out?"out":""}">
          ${out?t("out_of_stock"):t("in_stock")}
        </span>

      </div>

      <button
        class="add-btn"
        ${out?"disabled":""}
        onclick="event.stopPropagation();addToCartById('${escapeId(product.id)}')"
      >
        ${out?t("out_of_stock"):"🛒 "+t("add_to_cart")}
      </button>

    </div>

  </div>

  `;
}

/* =====================================================
   ESCAPING
===================================================== */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeId(value){

  return String(value??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

/* =====================================================
   PRODUCT FILTER
===================================================== */

function filteredProducts(){

  return products.filter(product=>{

    const name=String(
      product.name||
      product.title||
      ""
    ).toLowerCase();

    const matchesSearch=
      !searchTerm||
      name.includes(searchTerm.toLowerCase());

    let categoryValue=
      product.category||
      product.categoryId||
      "all";

    const matchesCategory=
      activeCategory==="all"||
      String(categoryValue)===String(activeCategory);

    return matchesSearch&&matchesCategory;

  });

}

function addToCartById(id){

  const product=products.find(
    p=>String(p.id)===String(id)
  );

  if(product)
    addToCart(product,1);
}

/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProductGrids(){

  const list=filteredProducts();

  const featured=list.filter(
    p=>p.featured===true
  );

  const popular=list.filter(
    p=>p.popular===true
  );

  const newest=[...list]
    .sort((a,b)=>{
      const aa=a.createdAt?.seconds||
        new Date(a.createdAt||0).getTime()||0;

      const bb=b.createdAt?.seconds||
        new Date(b.createdAt||0).getTime()||0;

      return bb-aa;
    })
    .slice(0,10);

  document.getElementById("featured-grid").innerHTML=
    (featured.length?featured:list.slice(0,6))
      .map(productCard).join("")||
    emptyProducts();

  document.getElementById("popular-grid").innerHTML=
    (popular.length?popular:list.slice(0,6))
      .map(productCard).join("")||
    emptyProducts();

  document.getElementById("new-grid").innerHTML=
    newest.map(productCard).join("")||
    emptyProducts();

  document.getElementById("category-grid").innerHTML=
    list.map(productCard).join("")||
    emptyProducts();

}

  const list=document.getElementById("cart-list");

    list.innerHTML=`

        <h3>${t("empty_cart")}</h3>

        <p style="margin-top:7px">
          Add products to your cart to see them here.

    `;

    document.getElementById(
      "cart-summary-wrap"
    ).innerHTML="";

    return;

  }

  list.innerHTML=cart.map(item=>`

    <div class="cart-item">

      <img
        src="${escapeHtml(item.image)}"
        onerror="this.src='https://via.placeholder.com/100?text=BDU'"
      >

      <div class="info">

        <div class="name">
          ${escapeHtml(item.name)}
        </div>

        <div class="price">
          ${fmtPrice(item.price)}
        </div>

        <div class="cart-qty">

            onclick="changeCartQty('${escapeId(item.id)}',-1)"

            −

            onclick="changeCartQty('${escapeId(item.id)}',1)"

            +

      </div>

        ${fmtPrice(
          Number(item.price)*Number(item.qty)

  `).join("");

  const total=cartTotal();

  document.getElementById(
    "cart-summary-wrap"
  ).innerHTML=`

    <div class="cart-summary">

      <div class="summary-row">
        <span>${t("subtotal")}</span>

        <span>${t("total")}</span>

        class="btn btn-solid"
        style="width:100%;margin-top:12px"
        onclick="startCheckout()"
      >
        ${t("checkout")} →
      </button>

    </div>

  `;

}

  summary.innerHTML=`

        justify-content:space-between;
        margin-bottom:7px;
        font-size:13px;
      ">

        <span>
          ${escapeHtml(i.name)} × ${i.qty}
        </span>

        <b>
          ${fmtPrice(i.price*i.qty)}
        </b>

      </div>

    `).join("")}

    <div style="
      border-top:1px solid var(--line);
      margin-top:10px;
      padding-top:10px;
      display:flex;
      justify-content:space-between;
      font-weight:900;
    ">

      <span>${t("total")}</span>
      <span>${fmtPrice(cartTotal())}</span>

    </div>
  `;

  showPage("page-checkout");
}

/* =====================================================
   PRODUCT DETAIL
===================================================== */

function openProductSheet(id){

  currentProduct=products.find(
    p=>String(p.id)===String(id)
  );

  if(!currentProduct)return;

  pdQty=1;

  document.getElementById(
    "pd-qty"
  ).textContent=pdQty;

  document.getElementById(
    "pd-name"
  ).textContent=
    currentProduct.name||
    currentProduct.title||
    "Product";

  document.getElementById(
    "pd-price"
  ).textContent=
    fmtPrice(currentProduct.price);

  document.getElementById(
    "pd-desc"
  ).textContent=
    currentProduct.description||
    currentProduct.desc||
    "";

  document.getElementById(
    "pd-rating"
  ).textContent=
    "⭐ "+Number(
      currentProduct.rating||0
    ).toFixed(1);

  document.getElementById(
    "pd-stock"
  ).textContent=
    Number(currentProduct.stock??999999)>0
      ?t("in_stock")
      :t("out_of_stock");

  let images=[];

  if(Array.isArray(currentProduct.images))
    images=currentProduct.images;

  else if(currentProduct.image)
    images=[currentProduct.image];

  else if(currentProduct.imageUrl)
    images=[currentProduct.imageUrl];

  if(!images.length)
    images=[getProductImage(currentProduct)];

  document.getElementById(
    "pd-gallery"
  ).innerHTML=images.map(src=>`

    <img
      src="${escapeHtml(src)}"
      onerror="this.src='https://via.placeholder.com/600?text=BDU+Market'"
    >

  `).join("");

  document.getElementById(
    "pd-overlay"
  ).classList.add("show");

  document.getElementById(
    "pd-sheet"
  ).classList.add("show");

  loadReviews();

}

function closeProductSheet(){

  document.getElementById(
    "pd-overlay"
  ).classList.remove("show");

  document.getElementById(
    "pd-sheet"
  ).classList.remove("show");

}

function changePdQty(delta){

  if(!currentProduct)return;

  const stock=Number(
    currentProduct.stock??
    currentProduct.quantity??
    999999
  );

  pdQty+=delta;

  if(pdQty<1)
    pdQty=1;

  if(pdQty>stock)
    pdQty=stock;

  document.getElementById(
    "pd-qty"
  ).textContent=pdQty;

}

function addToCartFromDetail(){

  if(!currentProduct)return;

  addToCart(
    currentProduct,
    pdQty
  );

}

function buyNowFromDetail(){

  if(!currentProduct)return;

  addToCart(
    currentProduct,
    pdQty
  );

  closeProductSheet();
  startCheckout();

}

/* =====================================================
   REVIEWS
===================================================== */

async function loadReviews(){

  if(!currentProduct)return;

  const el=document.getElementById(
    "pd-review-list"
  );

  el.innerHTML="";

  try{

    const snap=await db.collection("reviews")
      .where(
        "productId",
        "==",
        currentProduct.id
      )
      .get();

    if(snap.empty){

      el.innerHTML=`
        <p style="
          color:var(--muted);
          padding:12px 0;
          font-size:13px;
        ">
          No reviews yet.
        </p>
      `;

      return;

    }

    snap.forEach(doc=>{

      const r=doc.data();

      el.innerHTML+=`

        <div class="review-item">

          <div style="font-weight:750">
            ${escapeHtml(
              r.userName||"Student"
            )}
          </div>

          <div class="stars">
            ${"⭐".repeat(
              Number(r.rating)||5
            )}
          </div>

          <div style="
            font-size:13px;
            color:var(--muted);
            margin-top:5px;
          ">
            ${escapeHtml(r.text||"")}
          </div>

        </div>

      `;

    });

  }catch(e){

    console.log("Review loading:",e);

  }

}

async function submitReview(){

  if(!currentProduct)return;

  const text=document.getElementById(
    "pd-review-text"
  ).value.trim();

  if(!text){

    showToast("Please write a review.");

    return;

  }

  try{

    await db.collection("reviews").add({

      productId:currentProduct.id,
      text:text,
      rating:pdStarRating,
      userName:
        tgUser?.first_name||
        "Student",
      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    document.getElementById(
      "pd-review-text"
    ).value="";

    showToast("⭐ Review submitted");

    loadReviews();

  }catch(e){

    console.error(e);

    showToast(
      "Unable to submit review."
    );

  }

}

/* =====================================================
   ORDERS
===================================================== */

async function loadOrders(){

  const el=document.getElementById(
    "orders-list"
  );

  el.innerHTML=`

    <div class="empty-state">

      <div class="icon">📦</div>

      <h3>${t("empty_orders")}</h3>

    </div>
  `;

  try{

    let query=db.collection("orders");

    if(tgUser?.id){

      query=query.where(
        "telegramId",
        "==",
        String(tgUser.id)
      );

    }

    const snap=await query
      .orderBy("createdAt","desc")
      .limit(30)
      .get();

    if(snap.empty)return;

    el.innerHTML="";

    snap.forEach(doc=>{

      const o=doc.data();

      const number=
        o.orderNumber||
        doc.id.slice(0,8);

      const total=
        Number(o.total)||0;

      el.innerHTML+=`

        <div style="
          margin:12px 16px;
          padding:16px;
          background:var(--card);
          border:1px solid var(--line);
          border-radius:19px;
          box-shadow:var(--shadow);
        ">

          <div style="
            display:flex;
            justify-content:space-between;
            font-weight:850;
          ">

            <span>#${escapeHtml(number)}</span>

            <span style="color:var(--accent)">
              ${fmtPrice(total)}
            </span>

          </div>

          <div style="
            margin-top:7px;
            color:var(--muted);
            font-size:12px;
          ">
            ${escapeHtml(
              o.status||"Pending"
            )}
          </div>

        </div>

      `;

    });

  }catch(e){

    console.log(e);

  }

}

/* =====================================================
   SUBMIT ORDER
===================================================== */

async function submitOrder(){

  if(!cart.length){

    showToast(t("empty_cart"));

    return;

  }

  const name=
    document.getElementById("ck-name")
      .value.trim();

  const uid=
    document.getElementById("ck-uid")
      .value.trim();

  const tgName=
    document.getElementById("ck-tg")
      .value.trim();

  const dorm=
    document.getElementById("ck-dorm")
      .value.trim();

  const room=
    document.getElementById("ck-room")
      .value.trim();

  const phone=
    document.getElementById("ck-phone")
      .value.trim();

  const notes=
    document.getElementById("ck-notes")
      .value.trim();

  if(!name||!uid||!dorm||!room||!phone){

    showToast(
      "Please fill in all required fields."
    );

    return;

  }

  const orderNumber=
    "BDU-"+Date.now().toString().slice(-8);

  const total=cartTotal();

  const order={

    orderNumber,

    items:cart,

    total,

    fullName:name,

    universityId:uid,

    telegramUsername:tgName,

    dormBlock:dorm,

    roomNumber:room,

    phoneNumber:phone,

    notes,

    telegramId:
      tgUser?.id?
      String(tgUser.id):
      "",

    status:"Pending",

    createdAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };

  try{

    await db.collection("orders")
      .add(order);

    lastOrderMessage=
      `BDU Market Order ${orderNumber}%0A`+
      `Name: ${name}%0A`+
      `University ID: ${uid}%0A`+
      `Dorm: ${dorm}%0A`+
      `Room: ${room}%0A`+
      `Total: ${fmtPrice(total)}`;

    cart=[];

    saveCart();

    document.getElementById(
      "confirm-order-num"
    ).textContent=
      "#"+orderNumber;

    showPage("page-confirm");

  }catch(e){

    console.error(e);

    showToast(
      "Unable to place order. Please try again."
    );

  }

}

/* =====================================================
   TELEGRAM SELLER
===================================================== */

function contactSeller(){

  const url=
    "https://t.me/"+
    SELLER_USERNAME+
    "?text="+
    encodeURIComponent(
      lastOrderMessage
        .replace(/%0A/g,"\n")
    );

  if(tg?.openTelegramLink){

    tg.openTelegramLink(url);

  }else{

    window.open(
      url,
      "_blank"
    );

  }

}

/* =====================================================
   ADMIN
===================================================== */

function openAdminLogin(){

  const password=
    prompt("Admin password:");

  if(password===null)return;

  /*
   Keep your existing admin authentication
   here if you already have one.
  */

  showToast(
    "Admin authentication is unchanged."
  );

}

/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(id){

  document.querySelectorAll(
    ".page"
  ).forEach(page=>{
    page.classList.remove("active");
  });

  const page=document.getElementById(id);

  if(page)
    page.classList.add("active");

  document.querySelectorAll(
    ".nav-btn"
  ).forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.page===id
    );

  });

  if(id==="page-cart")
    renderCart();

  if(id==="page-orders")
    loadOrders();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =====================================================
   EMPTY PRODUCTS
===================================================== */

function emptyProducts(){

  return `

    <div
      class="empty-state"
      style="grid-column:1/-1"
    >

      <div class="icon">🔎</div>

      <h3>${t("empty_products")}</h3>

    </div>

  `;

}

/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const el=document.getElementById(
    "toast"
  );

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{

    el.classList.remove("show");

  },2500);

}

/* =====================================================
   FIREBASE LOADING
===================================================== */

async function loadProducts(){

  try{

    const snap=
      await db.collection("products")
        .get();

    products=[];

    snap.forEach(doc=>{

      products.push({
        id:doc.id,
        ...doc.data()
      });

    });

    renderAll();

  }catch(e){

    console.error(
      "Products loading error:",
      e
    );

    showToast(
      "Unable to load products."
    );

  }

}

async function loadCategories(){

  try{

    const snap=
      await db.collection("categories")
        .get();

    categories=[];

    snap.forEach(doc=>{

      categories.push({
        id:doc.id,
        ...doc.data()
      });

    });

    renderCategories();

  }catch(e){

    console.log(
      "Categories collection unavailable."
    );

    categories=[];

    renderCategories();

  }

}

/* =====================================================
   PROFILE
===================================================== */

function updateProfile(){

  if(!tgUser)return;

  const name=
    tgUser.first_name||
    "Student";

  const username=
    tgUser.username?
    "@"+tgUser.username:
    "@telegram";

  document.getElementById(
    "profile-name"
  ).textContent=name;

  document.getElementById(
    "profile-username"
  ).textContent=username;

  document.getElementById(
    "profile-initial"
  ).textContent=
    name.charAt(0).toUpperCase();

}

/* =====================================================
   RENDER ALL
===================================================== */

function renderAll(){

  renderCategories();
  renderProductGrids();
  renderCart();
  updateCartCount();
  updateProfile();
  updateThemeText();

}

/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    updateProfile();

    updateCartCount();

    setLang(currentLang);

    loadProducts();

    loadCategories();

  }
);

</script>
